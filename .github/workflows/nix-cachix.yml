# Builds the Nix flake package for linux x86_64 on GitHub workers and pushes
# every built store path to the `sable-next` Cachix cache (currently empty).
#
# Pushes happen through cachix/cachix-action's post-build hook, so the only
# build step is `nix build`; anything that derivation builds lands in the cache.
#
# Required repo secret: CACHIX_AUTH_TOKEN (a write token for the sable-next
# cache, e.g. `CACHIX_AUTH_TOKEN` from ~/.env). No public key needed here;
# consumers add the substituter on their own NixOS side.
#
# NOTE: this workflow needs flake.nix + flake.lock present on main. They are
# currently staged locally but not yet pushed.
name: Nix build + Cachix push (x86_64-linux)

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - src-tauri/**
      - scripts/build-wasm.mjs
      - .github/workflows/nix-cachix.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-cachix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    name: Build x86_64-linux, push to sable-next
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v25

      - name: Set up Cachix (sable-next)
        uses: cachix/cachix-action@v16
        with:
          name: sable-next
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build default package (x86_64-linux)
        run: nix build '.#packages.x86_64-linux.default' --print-build-logs -L
