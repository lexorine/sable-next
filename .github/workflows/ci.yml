# Mirrors the Forgejo gates in .forgejo/workflows/{quality-checks,rust-quality}.yml
# so a GitHub PR gets the same build, test and policy coverage. The steps are
# spelled out rather than pulled from ./.github/actions/setup because that
# composite exists to feed tauri-build.yml: its only consumer is a release
# bundle, and PR CI wants the toolchain without the version stamping.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise's own API rate limit only; absent on forks, which mise tolerates.
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version input: pnpm reads the packageManager field of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.7'
          cache: true
          # mise's shims carry the tools; its env exports would only shadow the
          # Node.js that setup-node pinned.
          env: false
          install: true

      # mise refuses to read an untrusted project mise.toml, and the WASM build
      # reaches for it through `mise exec`. Without this the job dies before
      # compiling anything.
      - name: Trust project mise configuration
        shell: bash
        working-directory: ${{ github.workspace }}
        run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

      # The bindings are a pure function of the Rust sources and the pinned
      # toolchain, so only the first miss compiles them.
      - name: Restore WASM bindings
        id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/generated/wasm
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'mise.toml', 'scripts/build-wasm.mjs') }}

      - name: Set up Rust
        if: ${{ steps.wasm.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      # Not `wasm`: the rust-wasm job holds that key, and two runners writing
      # one entry evict each other.
      - name: Cache Rust artifacts
        if: ${{ steps.wasm.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm-build
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JavaScript dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      # One job, because lto with codegen-units = 1 is what OOMs otherwise.
      - name: Build the WASM bindings
        if: ${{ steps.wasm.outputs.cache-hit != 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CARGO_BUILD_JOBS: '1'
        run: pnpm wasm:build

      # A VITE_SENTRY_DSN without upload credentials would ship a build that
      # reports errors against a release it cannot map back. No DSN is set on
      # purpose here, so this is a guard against that, not a gate.
      - name: Verify Sentry source map configuration
        shell: bash
        run: |
          if [ -z "${VITE_SENTRY_DSN:-}" ]; then
            exit 0
          fi
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is required when VITE_SENTRY_DSN is set}"
          : "${SENTRY_ORG:?SENTRY_ORG is required when VITE_SENTRY_DSN is set}"
          : "${SENTRY_PROJECT:?SENTRY_PROJECT is required when VITE_SENTRY_DSN is set}"
          : "${VITE_APP_VERSION:?VITE_APP_VERSION is required when VITE_SENTRY_DSN is set}"

      # `vite build` rather than `pnpm build`, whose prebuild hook would
      # recompile the bindings the cache just restored.
      - name: Build app
        shell: bash
        working-directory: ${{ github.workspace }}
        run: pnpm exec vite build

      - name: Upload web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend lint, typecheck and tests
    # ESLint runs with projectService, and vitest resolves the bindings through
    # vite.config.ts, so this job needs the web build's output.
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      # mise itself, none of its tools: nothing here runs through `mise exec`.
      # The action still exports mise.toml's `_.path`, so node_modules/.bin
      # reaches PATH, and every job trusts the project config the same way.
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.7'
          cache: true
          env: false
          install: false

      - name: Trust project mise configuration
        shell: bash
        working-directory: ${{ github.workspace }}
        run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

      - name: Install JavaScript dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      # `--cache-strategy content`, because a fresh checkout remtimes every file.
      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-

      - name: Check Oxfmt formatting
        run: pnpm fmt:check

      - name: Run Stylelint
        if: ${{ !cancelled() }}
        run: pnpm stylelint

      - name: Run ESLint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Run svelte-check
        if: ${{ !cancelled() }}
        run: pnpm check

      - name: Check for unused code
        if: ${{ !cancelled() }}
        run: pnpm knip

      # A red lint should not also buy ten minutes of vitest: each step that
      # can be skipped is chained on `!cancelled()`, and the run reports one
      # failure at a time. The gate is the same either way.
      - name: Run Vitest with coverage thresholds
        if: ${{ !cancelled() }}
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --all-features turns on sable-hdr's `tauri` feature, and tauri links
      # webkit2gtk on Linux whatever the runtime it is built for.
      - name: Install Linux Tauri dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libpipewire-0.3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: workspace
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest@0.9.146

      - name: Run Clippy
        run: cargo clippy --locked --workspace --exclude app --all-targets --all-features -- -D warnings

      - name: Run tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked --workspace --exclude app --all-features

      - name: Check generated bindings are current
        if: ${{ !cancelled() }}
        run: cargo run --locked -p sable-core --example generate-types --features typegen -- --check

  rust-app:
    name: App crate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Tauri dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libpipewire-0.3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest@0.9.146

      # No --all-features: that turns on both desktop runtimes and downloads CEF.
      # The release workflow covers the CEF build.
      - name: Run Clippy
        run: cargo clippy --locked -p app --all-targets -- -D warnings

      - name: Run tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked -p app

  rust-wasm:
    name: WASM target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy
          targets: wasm32-unknown-unknown

      # mise for one thing: wasm-bindgen-test-runner, at the version scripts/
      # build-wasm.mjs asserts against Cargo.lock. A different runner cannot
      # drive tests compiled against a different wasm-bindgen.
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.7'
          cache: true
          env: false

      - name: Trust project mise configuration
        shell: bash
        working-directory: ${{ github.workspace }}
        run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Clippy
        run: cargo clippy --locked -p sable-wasm --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings

      # Not a GitHub-hosted image, so it carries neither browser nor driver, and
      # noble's `chromium` is a stub for a snap, which cannot run here. Chrome
      # comes from Google's own repository, and only Chrome for Testing
      # publishes a chromedriver, so it is fetched for the milestone apt
      # installed.
      - name: Install Chrome and its driver
        id: drivers
        shell: bash
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo tee /etc/apt/keyrings/google-chrome.asc >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] https://dl.google.com/linux/chrome/deb/ stable main' \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y google-chrome-stable python3 unzip
          milestone="$(google-chrome --version | grep -oE '[0-9]+' | head -n 1)"
          url="$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone-with-downloads.json \
            | python3 -c 'import json,sys;m=sys.argv[1];d=json.load(sys.stdin)["milestones"][m]["downloads"]["chromedriver"];print(next(e["url"] for e in d if e["platform"]=="linux64"))' "$milestone")"
          curl -fsSL "$url" -o "$RUNNER_TEMP/chromedriver.zip"
          unzip -q -j "$RUNNER_TEMP/chromedriver.zip" '*/chromedriver' -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/chromedriver"
          echo "chromedriver=$RUNNER_TEMP/chromedriver" >>"$GITHUB_OUTPUT"

      # Chrome needs its sandbox off, having no user namespaces here; that is
      # what webdriver.json carries.
      - name: Run tests on Chrome
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CHROMEDRIVER: ${{ steps.drivers.outputs.chromedriver }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/.forgejo/webdriver.json
        run: cargo test --locked -p sable-wasm --target wasm32-unknown-unknown --profile wasm-test

  policy:
    name: Format and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny resolves the graph through `cargo metadata`, so cargo has to
      # be on PATH, but it compiles nothing and wants no artifact cache.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.7'
          cache: true
          env: false
          install: false

      - name: Trust project mise configuration
        shell: bash
        working-directory: ${{ github.workspace }}
        run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

      # Prebuilt, rather than a `cargo install` that compiles it every run.
      - name: Check dependency policy
        shell: bash
        run: mise exec aqua:EmbarkStudios/cargo-deny@0.20.2 -- cargo-deny check

      - name: Check Rust formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo fmt --all -- --check